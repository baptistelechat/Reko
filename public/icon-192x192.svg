<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="192" height="192" rx="32" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
  </defs>
  
  <!-- Film icon -->
  <rect x="48" y="64" width="96" height="64" rx="8" fill="white" opacity="0.9"/>
  <rect x="56" y="72" width="80" height="48" rx="4" fill="url(#gradient)" opacity="0.8"/>
  
  <!-- Film strips -->
  <rect x="40" y="64" width="8" height="64" fill="white" opacity="0.7"/>
  <rect x="144" y="64" width="8" height="64" fill="white" opacity="0.7"/>
  
  <!-- Perforations -->
  <circle cx="44" cy="76" r="2" fill="url(#gradient)"/>
  <circle cx="44" cy="88" r="2" fill="url(#gradient)"/>
  <circle cx="44" cy="100" r="2" fill="url(#gradient)"/>
  <circle cx="44" cy="112" r="2" fill="url(#gradient)"/>
  
  <circle cx="148" cy="76" r="2" fill="url(#gradient)"/>
  <circle cx="148" cy="88" r="2" fill="url(#gradient)"/>
  <circle cx="148" cy="100" r="2" fill="url(#gradient)"/>
  <circle cx="148" cy="112" r="2" fill="url(#gradient)"/>
  
  <!-- Play button -->
  <circle cx="96" cy="96" r="16" fill="white" opacity="0.9"/>
  <polygon points="90,86 90,106 108,96" fill="url(#gradient)"/>
  
  <!-- REKO text -->
  <text x="96" y="152" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">REKO</text>
</svg>